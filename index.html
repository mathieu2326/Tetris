<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>Tetris</h1>
      <div class="stat">
        <span>Score</span>
        <strong id="score">0</strong>
      </div>
      <div class="stat">
        <span>Level</span>
        <strong id="level">1</strong>
      </div>
      <div class="stat">
        <span>Lines</span>
        <strong id="lines">0</strong>
      </div>
      <div class="next-wrapper">
        <span>Next</span>
        <canvas id="next-canvas" width="120" height="120" aria-label="Next piece preview"></canvas>
      </div>
      <button id="restart-btn" type="button">Restart</button>
      <p class="help">
        ← → Move · ↑ Rotate · ↓ Soft drop · Space Hard drop
      </p>
    </section>

    <section class="board-wrapper">
      <canvas id="game-canvas" width="300" height="600" aria-label="Tetris game board"></canvas>
      <div id="overlay" class="overlay hidden">
        <p id="overlay-text">Game Over</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
